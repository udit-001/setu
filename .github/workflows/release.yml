name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Cache Android SDK packages
        uses: actions/cache@v6
        with:
          # NDK + CMake + platform/build-tools are auto-installed by Gradle/AGP
          # (licenses accepted below). Cache them so each release build does not
          # re-download ~2GB of SDK. Key on build config so version bumps bust it.
          path: |
            ${{ env.ANDROID_HOME }}/ndk
            ${{ env.ANDROID_HOME }}/cmake
            ${{ env.ANDROID_HOME }}/platforms
            ${{ env.ANDROID_HOME }}/build-tools
          key: android-sdk-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'app/build.gradle.kts') }}
          restore-keys: android-sdk-${{ runner.os }}-

      - name: Accept Android SDK licenses
        run: |
          # The runner ships an Android SDK at $ANDROID_HOME; accept all
          # licenses so Gradle/AGP can auto-install missing packages (NDK,
          # CMake, platform 37).
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Prepare release signing key
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            echo "$RELEASE_KEYSTORE_B64" | base64 -d > /tmp/setu-release.keystore
          else
            echo "::warning::RELEASE_KEYSTORE_B64 not set — falling back to debug keystore"
          fi

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: |
          cd app/build/outputs/apk/release
          APK=$(ls *.apk | head -1)
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            NAME="Setu-$GITHUB_REF_NAME.apk"
          else
            VERSION=$(grep -oP 'versionName = "\K[^"]+' ../../../build.gradle.kts)
            NAME="Setu-$VERSION.apk"
          fi
          cp "$APK" "$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "app/build/outputs/apk/release/$APK_NAME" \
            --title "Setu $GITHUB_REF_NAME" \
            --generate-notes

      - name: Upload artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: Setu-release-apk
          path: app/build/outputs/apk/release/${{ env.APK_NAME }}
